services:
  - type: web
    name: drills-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false
      - key: DRILLS_CORS_ORIGINS
        value: https://mialy333.github.io,http://localhost:4321,http://127.0.0.1:4321
