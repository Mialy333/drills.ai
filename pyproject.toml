[project]
name = "drills-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0.0,<4.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115,<1.0",
    "slowapi>=0.1.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "mcp[cli]==2.3.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
