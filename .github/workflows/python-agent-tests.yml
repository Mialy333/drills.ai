name: Python agent pipeline tests

on:
  push:
    branches:
      - devday-codex
      - feat/agent-orchestration
      - feat/validator-hardening
  pull_request:
    branches:
      - devday-codex
      - feat/agent-orchestration
      - main

jobs:
  test-agent-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-devday.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-devday.txt
      - name: Run offline agent-pipeline tests
        run: python -m pytest -q tests/test_agent_pipeline.py
