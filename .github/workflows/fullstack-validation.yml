name: Full-stack validation

on:
  push:
    branches:
      - feat/fastapi-multi-agent-backend
      - feat/drills-ai-ux-refactor
      - feat/hackathon-mvp
  pull_request:
    branches:
      - feat/offline-first-session
      - feat/fastapi-multi-agent-backend
      - feat/drills-ai-ux-refactor
      - feat/hackathon-mvp
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-devday.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-devday.txt
      - run: python -m pytest -q
